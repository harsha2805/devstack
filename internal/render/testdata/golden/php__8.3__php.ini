; Generated by devstack. Do not edit; change stack.toml or etc-custom/.
; php-8.3 (8.3.36) from ROOT/bin/php/8.3
; This is ROOT/etc-custom/php/8.3/php.ini (Servers > php.ini in the app),
; then the lines devstack sets. Edit that file, not this one.

; php.ini for PHP 8.3: every site on PHP 8.3 uses it, and so do php and
; composer in their terminals. It's yours to edit. Save it and PHP 8.3 restarts
; with it within a few seconds while the servers run.
;
; Extensions: remove the ; in front of an extension=... line to turn it on, or
; put one there to turn it off. They're listed under "Dynamic Extensions".
;
; devstack sets these itself, after this file, because they point into its
; folders: extension_dir, error_log, sys_temp_dir, upload_tmp_dir, session.save_path.
; [php.ini] in stack.toml applies to every PHP version and wins over this file.
; For one site only, put a .user.ini in that site's docroot (public\ for
; Laravel) instead.
;
; Delete this file to start over from devstack's defaults.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
default_charset = "UTF-8"
variables_order = "EGPCS"
request_order = "GP"
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
post_max_size = 256M
upload_max_filesize = 256M
max_file_uploads = 50
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
html_errors = On
cgi.fix_pathinfo = 1
user_ini.cache_ttl = 5
date.timezone = UTC
session.use_strict_mode = 1
session.cookie_httponly = 1
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
extension=curl
extension=mbstring
extension=pdo_mysql
zend_extension=opcache

[PHP]
; From stack.toml [php.ini], for every PHP version. Later lines win.
date.timezone = Asia/Kolkata
memory_limit = 1G
; Set by devstack: these point into its folders.
extension_dir = "ROOT/bin/php/8.3/ext"
error_log = "ROOT/logs/php-8.3-error.log"
sys_temp_dir = "ROOT/tmp/php"
upload_tmp_dir = "ROOT/tmp/php/uploads"
session.save_path = "ROOT/tmp/php/sessions"
