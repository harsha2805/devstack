# Generated by devstack. Do not edit; change stack.toml or etc-custom/.

worker_processes  1;
error_log  "ROOT/logs/nginx-error.log" warn;
pid        "ROOT/tmp/nginx/nginx.pid";

events {
    worker_connections  1024;
}

http {
    include       "ROOT/bin/nginx/1.30/conf/mime.types";
    default_type  application/octet-stream;
    charset       utf-8;

    # Off so edits made on disk are always served fresh.
    sendfile           off;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size  256m;
    server_names_hash_bucket_size  128;

    client_body_temp_path  "ROOT/tmp/nginx/temp/client_body";
    proxy_temp_path        "ROOT/tmp/nginx/temp/proxy";
    fastcgi_temp_path      "ROOT/tmp/nginx/temp/fastcgi";
    uwsgi_temp_path        "ROOT/tmp/nginx/temp/uwsgi";
    scgi_temp_path         "ROOT/tmp/nginx/temp/scgi";

    log_format  devstack  '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
    access_log  off;

    fastcgi_buffer_size   32k;
    fastcgi_buffers       16 16k;
    fastcgi_read_timeout  300s;

    # php-8.3 (8.3.36): one php-cgi per port, nginx spreads requests and skips a recycling worker.
    upstream php83 {
        server 127.0.0.1:9830 max_fails=1 fail_timeout=2s;
        server 127.0.0.1:9831 max_fails=1 fail_timeout=2s;
    }

    # Landing page for http://localhost and any unknown host.
    server {
        listen       127.0.0.1:8080 default_server;
        listen       [::1]:8080 default_server;
        server_name  localhost;
        root         "ROOT/etc/nginx/default";
        index        index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    include "ROOT/etc/nginx/sites/*.conf";
    include "ROOT/etc-custom/nginx/*.conf";
}
