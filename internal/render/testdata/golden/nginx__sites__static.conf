# Generated by devstack. Do not edit; change stack.toml or etc-custom/.
# Site "static" from ROOT/www/static

server {
    listen       127.0.0.1:8080;
    listen       [::1]:8080;
    server_name  static.test *.static.test static.localhost *.static.localhost;
    root         "ROOT/www/static";
    index        index.php index.html index.htm;
    access_log   "ROOT/logs/sites/static.access.log" devstack;

    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Hide dotfiles (.env, .git) but keep ACME and other well-known paths.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # try_files resets $fastcgi_path_info, so keep a copy.
        set $path_info $fastcgi_path_info;
        # Only run scripts that exist; blocks /upload.jpg/x.php tricks.
        try_files $fastcgi_script_name =404;
        include "ROOT/etc/nginx/fastcgi.conf";
        fastcgi_pass php83;
    }
}
