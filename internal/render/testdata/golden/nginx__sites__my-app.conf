# Generated by devstack. Do not edit; change stack.toml or etc-custom/.
# Site "My_App" from ROOT/www/My_App

server {
    listen       127.0.0.1:8080;
    listen       [::1]:8080;
    server_name  my-app.test *.my-app.test my-app.localhost *.my-app.localhost;
    root         "ROOT/www/My_App/public";
    index        index.php index.html index.htm;
    access_log   "ROOT/logs/sites/my-app.access.log" devstack;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hide dotfiles (.env, .git) but keep ACME and other well-known paths.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # try_files resets $fastcgi_path_info, so keep a copy.
        set $path_info $fastcgi_path_info;
        # Only run scripts that exist; blocks /upload.jpg/x.php tricks.
        try_files $fastcgi_script_name =404;
        include "ROOT/etc/nginx/fastcgi.conf";
        fastcgi_pass php83;
    }
}
