{{define "php.ini"}}{{header ";"}}
; {{.Pool.Name}} ({{.Pool.Build.Version}}) from {{path .Pool.Build.Dir}}

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
default_charset = "UTF-8"
variables_order = "EGPCS"
request_order = "GP"

memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
post_max_size = 256M
upload_max_filesize = 256M
max_file_uploads = 50

; Development defaults: show everything.
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
html_errors = On
error_log = {{q .Logs (printf "%s-error.log" .Pool.Name)}}

extension_dir = {{q .Pool.ExtDir}}
sys_temp_dir = {{q .Tmp "php"}}
upload_tmp_dir = {{q .Tmp "php/uploads"}}
cgi.fix_pathinfo = 1
; A site's .user.ini (per-site settings, in its docroot) applies within seconds
; of an edit; PHP's default is to cache it for 5 minutes.
user_ini.cache_ttl = 5
{{range .Pool.Extensions}}
extension = {{.}}
{{- end}}
{{- if .Pool.Opcache}}
zend_extension = opcache
{{- end}}

[Date]
date.timezone = UTC

[Session]
session.save_path = {{q .Tmp "php/sessions"}}
session.use_strict_mode = 1
session.cookie_httponly = 1
{{- if .Pool.Opcache}}

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Check file times on every request so edits show up immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
{{- end}}
{{- if .Pool.INI}}

; From stack.toml [php.ini]. Later lines win.
{{- range $k := sortedKeys .Pool.INI}}
{{$k}} = {{index $.Pool.INI $k}}
{{- end}}
{{- end}}
{{- if .Custom}}

; From {{path .Pool.CustomINI}}. Later lines win.
{{.Custom}}
{{- end}}
{{end}}
