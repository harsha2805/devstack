{{define "my.ini"}}{{header "#"}}
# mysql {{.MySQL.Build.Version}} from {{path .MySQL.Build.Dir}}

[mysqld]
basedir = {{q .MySQL.Build.Dir}}
datadir = {{q .MySQL.DataDir}}
port = {{.MySQL.Port}}
bind-address = 127.0.0.1
# X Protocol (33060) is not needed and would clash with other local MySQL servers.
mysqlx = OFF

character-set-server = utf8mb4
collation-server = utf8mb4_0900_ai_ci
max_allowed_packet = 256M
innodb_buffer_pool_size = 256M
tmpdir = {{q .Tmp}}

[client]
host = 127.0.0.1
port = {{.MySQL.Port}}
default-character-set = utf8mb4
{{end}}
