{{define "my.ini"}}{{header "#"}}
# mysql {{.MySQL.Build.Version}} from {{path .MySQL.Build.Dir}}

[mysqld]
basedir = {{q .MySQL.Build.Dir}}
datadir = {{q .MySQL.DataDir}}
port = {{.MySQL.Port}}
bind-address = 127.0.0.1
# X Protocol (33060) is not needed and would clash with other local MySQL servers.
mysqlx = OFF

character-set-server = utf8mb4
collation-server = utf8mb4_0900_ai_ci
max_allowed_packet = 256M
innodb_buffer_pool_size = 256M
# A development machine needs no replication log, and can lose the last second
# of writes in a power cut in exchange for much faster commits.
skip-log-bin
innodb_flush_log_at_trx_commit = 2
tmpdir = {{q .Tmp}}

[client]
host = 127.0.0.1
port = {{.MySQL.Port}}
default-character-set = utf8mb4

# Your own settings: any .cnf or .ini file in this folder is read last, so its
# values win (for example [mysqld] innodb_flush_log_at_trx_commit = 1).
!includedir {{path .EtcCustom}}/mysql
{{end}}
