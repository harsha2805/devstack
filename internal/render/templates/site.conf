{{define "site.conf"}}{{header "#"}}
# Site "{{.Site.Name}}" from {{path .Site.Dir}}

server {
    listen       127.0.0.1:{{.HTTPPort}};
{{- if .IPv6}}
    listen       [::1]:{{.HTTPPort}};
{{- end}}
{{- if .Site.CertFile}}
    listen       127.0.0.1:{{.HTTPSPort}} ssl;
{{- if .IPv6}}
    listen       [::1]:{{.HTTPSPort}} ssl;
{{- end}}
    http2        on;
    ssl_certificate      {{q .Site.CertFile}};
    ssl_certificate_key  {{q .Site.KeyFile}};
{{- end}}
    server_name  {{join .Site.Hostnames " "}};
    root         {{q .Site.Docroot}};
    index        index.php index.html index.htm;
    access_log   {{q .Site.AccessLog}} devstack;

    location / {
{{- if .Site.HasIndex}}
        try_files $uri $uri/ /index.php?$query_string;
{{- else}}
        autoindex on;
        try_files $uri $uri/ =404;
{{- end}}
    }

    # Hide dotfiles (.env, .git) but keep ACME and other well-known paths.
    location ~ /\.(?!well-known/) {
        deny all;
    }
{{- if .Site.PHP}}

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # try_files resets $fastcgi_path_info, so keep a copy.
        set $path_info $fastcgi_path_info;
        # Only run scripts that exist; blocks /upload.jpg/x.php tricks.
        try_files $fastcgi_script_name =404;
        include {{q .Etc "nginx/fastcgi.conf"}};
        fastcgi_pass {{.Site.PHP.Upstream}};
    }
{{- end}}
}
{{end}}
