{{define "nginx.conf"}}{{header "#"}}

worker_processes  1;
error_log  {{q .Logs "nginx-error.log"}} warn;
pid        {{q .Tmp "nginx/nginx.pid"}};

events {
    worker_connections  1024;
}

http {
    include       {{q .Nginx.Dir "conf/mime.types"}};
    default_type  application/octet-stream;
    charset       utf-8;

    # Off so edits made on disk are always served fresh.
    sendfile           off;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size  256m;
    server_names_hash_bucket_size  128;

    client_body_temp_path  {{q .Tmp "nginx/temp/client_body"}};
    proxy_temp_path        {{q .Tmp "nginx/temp/proxy"}};
    fastcgi_temp_path      {{q .Tmp "nginx/temp/fastcgi"}};
    uwsgi_temp_path        {{q .Tmp "nginx/temp/uwsgi"}};
    scgi_temp_path         {{q .Tmp "nginx/temp/scgi"}};

    log_format  devstack  '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
    access_log  off;

    fastcgi_buffer_size   32k;
    fastcgi_buffers       16 16k;
    fastcgi_read_timeout  300s;
{{range .PHP}}
    # {{.Name}} ({{.Build.Version}}): one php-cgi per port, nginx spreads requests and skips a recycling worker.
    upstream {{.Upstream}} {
{{- range .Ports}}
        server 127.0.0.1:{{.}} max_fails=1 fail_timeout=2s;
{{- end}}
    }
{{end}}
    # Landing page for http://localhost and any unknown host.
    server {
        listen       127.0.0.1:{{.HTTPPort}} default_server;
{{- if .IPv6}}
        listen       [::1]:{{.HTTPPort}} default_server;
{{- end}}
        server_name  localhost;
        root         {{q .Etc "nginx/default"}};
        index        index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    include {{q .Etc "nginx/sites/*.conf"}};
    include {{q .EtcCustom "nginx/*.conf"}};
}
{{end}}
