<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>devstack</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="dash" class="shell" hidden>
  <aside class="rail" aria-label="devstack">
    <section class="status" id="status" aria-live="polite">
      <div class="status-text">
        <div class="status-word" id="state-word">Stopped</div>
        <div class="status-line" id="state-line"></div>
      </div>
      <button class="btn small" id="power"></button>
    </section>
    <div class="slots" id="slots" aria-label="Servers"></div>
    <nav class="nav" id="nav" aria-label="Pages">
      <button data-page="sites"></button>
      <button data-page="php"></button>
      <button data-page="database"></button>
      <button data-page="logs"></button>
    </nav>
    <div class="grow"></div>
    <nav class="nav" aria-label="Settings">
      <button data-page="settings"></button>
    </nav>
  </aside>

  <main class="work">
    <div class="alerts" id="alerts"></div>

    <section class="page sites-page" data-page="sites">
      <div class="sites-main">
        <header class="page-head">
          <h1>Sites <span class="count num" id="site-count"></span></h1>
          <div class="grow"></div>
          <input type="search" id="find" class="find" placeholder="Find a site" spellcheck="false" aria-label="Find a site">
          <button class="btn icon-only ghost" id="reload" aria-label="Reload stack.toml" title="Apply changes to stack.toml (folders in www are picked up on their own)"></button>
          <div class="menu-wrap">
            <button class="btn primary" id="add-site" aria-haspopup="menu" aria-expanded="false"></button>
            <div class="menu" id="add-menu" role="menu" hidden>
              <button role="menuitem" id="menu-www"></button>
              <button role="menuitem" id="menu-folder"></button>
            </div>
          </div>
        </header>
        <div class="scroll" id="sites-scroll">
          <div id="sites"></div>
        </div>
      </div>
      <aside class="panel" id="panel" aria-label="Site details" hidden></aside>
    </section>

    <section class="page" data-page="php">
      <header class="page-head"><h1>PHP</h1><div class="grow"></div><span class="muted" id="php-default"></span></header>
      <div class="scroll"><div class="page-body" id="php"></div></div>
    </section>

    <section class="page" data-page="database">
      <header class="page-head"><h1>Database</h1></header>
      <div class="scroll"><div class="page-body" id="db"></div></div>
    </section>

    <section class="page logs-page" data-page="logs">
      <header class="page-head">
        <h1>Logs</h1>
        <div class="grow"></div>
        <label class="check"><span class="switch"><input type="checkbox" id="log-follow" checked><span></span></span>Follow</label>
        <button class="btn" id="log-folder"></button>
      </header>
      <div class="logs-body">
        <div class="log-files" id="log-files" role="listbox" aria-label="Log files"></div>
        <pre id="log-text" tabindex="0" aria-label="Log"></pre>
      </div>
    </section>

    <section class="page" data-page="settings">
      <header class="page-head"><h1>Settings</h1></header>
      <div class="scroll"><div class="page-body settings" id="settings"></div></div>
    </section>
  </main>
</div>

<div id="setup" class="shell setup" hidden>
  <aside class="rail" aria-label="devstack">
    <section class="status"><div class="status-text"><div class="status-word" id="setup-word">Not set up</div>
      <div class="status-line">Servers to download</div></div></section>
    <div class="slots" id="setup-slots"></div>
  </aside>
  <main class="work"><div class="scroll"><div class="setup-card" id="setup-card"></div></div></main>
</div>

<dialog id="ini" class="sheet" aria-labelledby="ini-title">
  <header class="sheet-head">
    <div class="grow">
      <h2 id="ini-title">PHP settings</h2>
      <div class="sheet-path mono" id="ini-path"></div>
    </div>
    <button class="btn small" id="ini-text"></button>
    <button class="btn small ghost icon-only" id="ini-close" aria-label="Close"></button>
  </header>
  <div class="sheet-search"><input type="search" id="ini-search" placeholder="Search settings and extensions" spellcheck="false" aria-label="Search settings and extensions"></div>
  <div class="sheet-body" id="ini-body"></div>
  <footer class="sheet-foot" id="ini-foot"></footer>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
