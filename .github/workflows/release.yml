# Builds a release when a v1.2.3 tag is pushed (publish-release.ps1 pushes it)
# and leaves it as a draft for publish-release.ps1 to check and publish.
#
# The build runs on GitHub's own runners from the tagged commit, which is what
# lets SignPath confirm the files came from this repository's source. With the
# SignPath settings below (docs/SIGNING.md) the exes and the installer are
# code-signed; without them the build is the same, unsigned.
#
# The update feed (latest.json) is not made here: it is signed with the offline
# release key, which never leaves the maintainer's machine.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the draft release
  actions: read     # SignPath reads this run and its artifacts

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 240   # signing waits for a person to approve each request
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version from the tag
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tags must look like v1.2.3" }
          . .\release-lib.ps1
          $null = Get-UpdateNotes $v   # the changelog must describe it
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test
        run: go test ./...

      - name: Build the exes
        run: .\build.ps1 -Version $env:VERSION -OutDir dist\release\bin

      - name: Upload the exes for signing
        id: exes
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: exes-unsigned
          path: dist/release/bin/*.exe
          if-no-files-found: error

      - name: Sign the exes
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exes
          github-artifact-id: ${{ steps.exes.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signed/exes

      - name: Use the signed exes
        if: env.SIGN == 'true'
        run: |
          . .\release-lib.ps1
          Assert-Signed (Get-ChildItem dist\signed\exes\*.exe).FullName
          Copy-Item dist\signed\exes\*.exe dist\release\bin -Force

      - name: Build the installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { throw "Installing Inno Setup failed" }
          }
          . .\release-lib.ps1
          New-Installer $env:VERSION dist\release\bin
          # A fixed name, so the SignPath configuration doesn't change per version.
          New-Item -ItemType Directory -Force dist\unsigned | Out-Null
          Copy-Item "dist\release\devstack_setup_$env:VERSION.exe" dist\unsigned\devstack_setup.exe

      - name: Upload the installer for signing
        id: setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: installer-unsigned
          path: dist/unsigned/devstack_setup.exe
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signed/setup

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: |
          . .\release-lib.ps1
          Assert-Signed dist\signed\setup\devstack_setup.exe
          Copy-Item dist\signed\setup\devstack_setup.exe "dist\release\devstack_setup_$env:VERSION.exe" -Force

      - name: Zip and checksums
        run: |
          . .\release-lib.ps1
          New-ReleaseFiles $env:VERSION dist\release\bin dist\release
          Get-Content dist\release\SHA256SUMS.txt

      - name: Draft release
        run: |
          . .\release-lib.ps1
          $tag = '${{ github.ref_name }}'
          $files = "dist\release\devstack_setup_$env:VERSION.exe", "dist\release\devstack_$($env:VERSION)_portable.zip", "dist\release\SHA256SUMS.txt"
          Get-ReleaseBody $env:VERSION | Set-Content notes.md -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # A re-run: replace the files of the draft that is already there.
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --draft --verify-tag --title "devstack $env:VERSION" --notes-file notes.md
          }
          if ($LASTEXITCODE) { throw "gh failed" }
